<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>@sybau_dharun</title>
<style>
  :root {
    --pink: #e60067;
    --orange: #ff5e36;
    --gold: #ffa600;
    --ink: #0f0f10;
    --muted: #8a8a92;
    --field-bg: #f2f2f5;
    --card-radius: 26px;
    --pill-radius: 999px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #e60067 0%, #ff5e36 50%, #ffa600 100%);
    color: var(--ink);
  }

  .app {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .brand {
    color: #fff;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.02em;
    margin-bottom: 18px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.15);
  }

  .card {
    width: 100%;
    background: #ffffff;
    border-radius: var(--card-radius);
    box-shadow: 0 24px 48px rgba(60, 0, 20, 0.22), 0 2px 10px rgba(0, 0, 0, 0.06);
    padding: 22px;
  }

  .profile-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .avatar {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar svg {
    width: 24px;
    height: 24px;
    fill: #fff;
  }

  .handle-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .handle {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }

  .headline {
    font-size: 18px;
    font-weight: 800;
    line-height: 1.2;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .field {
    width: 100%;
    box-sizing: border-box;
    display: block;
    border: 1.5px solid transparent;
    background: var(--field-bg);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .field::placeholder {
    color: var(--muted);
  }

  .field:focus {
    background: #fff;
    border-color: var(--orange);
  }

  .textarea-wrap {
    position: relative;
  }

  textarea.field {
    width: 100%;
    min-height: 118px;
    max-width: 100%;
    resize: vertical;
    padding-right: 46px;
    line-height: 1.4;
  }

  .dice-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .dice-btn:active {
    transform: scale(0.92);
  }

  .send-btn {
    margin-top: 4px;
    width: 100%;
    border: none;
    background: var(--ink);
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    padding: 15px 0;
    border-radius: var(--pill-radius);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .send-btn:hover {
    background: #262628;
  }

  .send-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .lock-row {
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    opacity: 0.92;
  }

  .social-proof {
    margin-top: 8px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    opacity: 0.92;
  }

  .footer {
    margin-top: 20px;
    display: flex;
    gap: 18px;
  }

  .footer a {
    color: rgba(255, 255, 255, 0.7);
    font-size: 12px;
    text-decoration: none;
  }

  .footer a:hover {
    text-decoration: underline;
  }

  @media (max-width: 360px) {
    .card { padding: 18px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="brand">@sybau_dharun</div>

    <div class="card">
      <div class="profile-header">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
        </div>
        <div class="handle-block">
          <span class="handle">@yourhandle</span>
          <span class="headline">send me messages!</span>
        </div>
      </div>

      <form id="qa-form" action="https://formspree.io/f/myezyakq" method="POST">
        <input
          class="field"
          type="text"
          name="instagram_handle"
          placeholder="Your Instagram Handle"
          aria-label="Your Instagram Handle"
          autocomplete="off"
          required
        >

        <div class="textarea-wrap">
          <textarea
            class="field"
            id="message"
            name="message"
            placeholder="send me messages..."
            aria-label="Your message"
            required
          ></textarea>
          <button type="button" class="dice-btn" id="dice-btn" aria-label="Fill in a random prompt" title="Random prompt">🎲</button>
        </div>

        <button type="submit" class="send-btn" id="send-btn">Send!</button>
      </form>
    </div>

    <div class="lock-row">🔒 q&amp;a</div>
    <div class="social-proof">⚡ 249 people just tapped the button ⚡</div>

    <div class="footer">
      <a href="#">Terms</a>
      <a href="#">Privacy</a>
    </div>
  </div>

  <script>
    var prompts = [
      "What's a hobby you wish you had more time for?",
      "What's the best advice you've ever gotten?",
      "What's something that made you smile today?",
      "If you could teleport anywhere right now, where would you go?",
      "What song has been stuck in your head lately?",
      "What's a small thing that always makes your day better?",
      "What's a show or book you'd recommend?",
      "What's your go-to comfort food?",
      "What's a goal you're working on this year?",
      "What's the last thing that made you laugh out loud?",
      "What's a random fact you know that most people don't?",
      "What's your favorite way to spend a weekend?"
    ];

    var diceBtn = document.getElementById('dice-btn');
    var textarea = document.getElementById('message');
    var form = document.getElementById('qa-form');
    var sendBtn = document.getElementById('send-btn');

    diceBtn.addEventListener('click', function () {
      var pick = prompts[Math.floor(Math.random() * prompts.length)];
      textarea.value = pick;
      textarea.focus();
    });

    form.addEventListener('submit', function () {
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';
    });
  </script>
</body>
</html>
