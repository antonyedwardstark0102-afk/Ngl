<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background: linear-gradient(135deg, #f093fb, #f5576c); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; font-family: sans-serif; }
    .card { background: #fff; width: 90%; max-width: 350px; padding: 25px; border-radius: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    input, textarea { width: 100%; margin: 8px 0 15px 0; padding: 12px; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: #000; color: #fff; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h3>send me anonymous messages!</h3>
    <form action=https://formspree.io/f/myezyakq method="POST">
      <input type="text" name="handle" placeholder="Your Instagram id" required>
      <textarea name="message" placeholder="Type message..." required></textarea>
      <button type="submit">Send!</button>
    </form>
  </div>
</body>
</html>
